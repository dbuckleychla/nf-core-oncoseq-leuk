<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ sample }} | OncoSeq review</title>
    <style>
      :root {
        --ink: #e6edf3;
        --muted: #a8bbc8;
        --line: #344654;
        --paper: #101820;
        --accent: #68c7c3;
        --warn: #e9b46c;
        --surface: #192631;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      header {
        background: #163748;
        color: white;
        padding: 26px max(24px, calc((100vw - 1360px) / 2));
      }
      header p {
        margin: 4px 0;
        color: #d9e6ed;
      }
      h1 {
        font-size: 28px;
        margin: 0;
      }
      h2 {
        font-size: 23px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      nav {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding: 12px 20px;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        padding: 7px 12px;
        cursor: pointer;
      }
      button:hover,
      button[aria-selected="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #101820;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #e8ab3b;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      main {
        max-width: 1400px;
        margin: auto;
        padding: 24px;
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .panel,
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 20px;
        margin-bottom: 18px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .card {
        margin: 0;
      }
      .card .value {
        font-size: 28px;
        font-weight: 650;
      }
      .muted {
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        font-size: 13px;
        padding: 2px 7px;
        border-radius: 4px;
        background: #213f43;
        color: #9cddd8;
      }
      .warning {
        background: #3b3022;
        color: #f1cf9a;
        border-left: 4px solid #cb8e39;
        padding: 12px 16px;
        margin: 14px 0;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      input {
        background: var(--surface);
        color: var(--ink);
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        max-width: 100%;
      }
      .table-scroll {
        overflow-x: auto;
        max-width: 100%;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th {
        text-align: left;
        background: #21333f;
        white-space: nowrap;
      }
      th,
      td {
        padding: 10px 9px;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      td {
        overflow-wrap: anywhere;
      }
      th button {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
      }
      pre {
        font:
          13px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      details {
        margin: 10px 0;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
        gap: 18px;
      }
      .figure {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        min-width: 0;
      }
      .figure img {
        width: 100%;
        height: auto;
        cursor: zoom-in;
      }
      .figure figcaption {
        font-size: 14px;
        overflow-wrap: anywhere;
        margin-bottom: 10px;
      }
      .figure button {
        margin-top: 8px;
      }
      dialog {
        background: var(--surface);
        color: var(--ink);
        width: min(1100px, 96vw);
        max-height: 92vh;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
      }
      dialog::backdrop {
        background: #102936aa;
      }
      .dialog-toolbar {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        position: sticky;
        top: 0;
        background: var(--surface);
        padding-bottom: 10px;
      }
      .zoom-scroll {
        overflow: auto;
        max-height: 75vh;
      }
      .zoom-scroll img {
        display: block;
        max-width: none;
        transform-origin: top left;
      }
      .scorebar {
        height: 8px;
        background: #344654;
        border-radius: 4px;
        margin-top: 8px;
      }
      .scorebar span {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 4px;
      }
      .empty {
        color: var(--muted);
        padding: 12px 0;
      }
      .footnote {
        font-size: 13px;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      .report-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 18px 0 8px;
      }
      .report-brand svg {
        width: min(280px, 100%);
        height: auto;
      }
      .report-brand span {
        color: #a8bbc8;
        font-size: 15px;
      }
      @media print {
        :root {
          --ink: #172c3d;
          --muted: #526774;
          --line: #d7e0e6;
          --paper: white;
          --surface: white;
          --accent: #086f83;
          color-scheme: light;
        }
        .report-brand svg {
          background: #163748;
          border-radius: 5px;
        }
        .report-brand span {
          color: black;
        }
        header {
          background: var(--surface);
          color: black;
          padding: 10px;
        }
        header p {
          color: black;
        }
        nav,
        .controls,
        button {
          display: none !important;
        }
        main {
          padding: 0;
        }
        .section {
          display: block !important;
          break-before: page;
        }
        .section:first-child {
          break-before: auto;
        }
        .table-scroll {
          overflow: visible;
        }
        tr,
        .card,
        .figure {
          break-inside: avoid;
        }
        .gallery {
          display: block;
        }
        .figure img {
          max-height: 600px;
          object-fit: contain;
        }
        details > * {
          display: block !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <p>ONCOSEQ / MOLECULAR REVIEW</p>
      <div class="report-brand">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 650 144"
          role="img"
          aria-label="FrankONTstein electric helix logo"
        >
          <g stroke-linecap="round" stroke-linejoin="round">
            <path d="M39 22h54l16 16v65l-17 18H40l-17-18V38Z" fill="none" stroke="#edf3ef" stroke-width="6" />
            <path d="M11 60h12m-12-7v14m98-7h12m0-7v14" stroke="#80958a" stroke-width="6" />
            <path d="M50 39c42 19-10 48 32 66M82 39c-42 19 10 48-32 66" fill="none" stroke="#82c99b" stroke-width="7" />
            <path d="M53 43h26M60 60h12m-12 24h12m-19 17h26" stroke="#edf3ef" stroke-width="3" />
            <path d="m90 16-3 14m-4-9 11 4" stroke="#82c99b" stroke-width="3" />
          </g>
          <text
            x="154"
            y="92"
            font-family="Arial, Helvetica, sans-serif"
            font-size="62"
            letter-spacing="-2.2"
            fill="#edf3ef"
          >
            <tspan font-weight="500">Frank</tspan>
            <tspan font-weight="800" fill="#82c99b">ONT</tspan>
            <tspan font-weight="500">stein</tspan>
          </text></svg
        ><span>FrankONTstein report</span>
      </div>
      <h1>{{ sample }}</h1>
      <p>Candidate findings, caller evidence and assay quality</p>
    </header>
    <nav role="tablist" aria-label="Report sections" id="navigation"></nav>
    <main id="report"></main>
    <dialog id="evidence">
      <div class="dialog-toolbar">
        <strong id="dialog-title">Evidence</strong><button id="close-dialog">Close</button>
      </div>
      <div id="dialog-content"></div>
    </dialog>
    <script type="application/json" id="review-data">
      {{ data_json | safe }}
    </script>
    <script>
      "use strict";
      const data = JSON.parse(document.getElementById("review-data").textContent);
      const el = (tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      };
      const fmt = (v) =>
        v === null || v === undefined
          ? "Not available"
          : typeof v === "number"
            ? Number(v.toFixed(4)).toLocaleString()
            : String(v);
      const names = [
        ["overview", "Overview"],
        ["classification", "Classification"],
        ["fusions", "Fusions"],
        ["small", "Small variants"],
        ["sv", "CNV and other SVs"],
        ["nasvar", "NASVAR"],
        ["qc", "Coverage and QC"],
        ["targets", "Target loci"],
        ["methods", "Methods and files"],
      ];
      const sections = {};
      for (const [id, label] of names) {
        const b = el("button", label);
        b.id = "tab-" + id;
        b.role = "tab";
        b.setAttribute("aria-controls", id);
        b.onclick = () => activate(id);
        document.getElementById("navigation").append(b);
        const s = el("section", undefined, "section");
        s.id = id;
        s.role = "tabpanel";
        s.setAttribute("aria-labelledby", b.id);
        s.append(el("h2", label));
        sections[id] = s;
        document.getElementById("report").append(s);
      }
      function activate(id) {
        if (!sections[id]) id = "overview";
        for (const [k, s] of Object.entries(sections)) {
          s.classList.toggle("active", k === id);
          document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === id));
        }
        history.replaceState(null, "", "#" + id);
        document.querySelectorAll("#" + id + " img[data-image]").forEach(loadImage);
      }
      function panel(section, title, text) {
        const p = el("div", undefined, "panel");
        if (title) p.append(el("h3", title));
        if (text) p.append(el("p", text, "muted"));
        section.append(p);
        return p;
      }
      function showEvidence(title, value) {
        const content = document.getElementById("dialog-content");
        content.replaceChildren();
        document.getElementById("dialog-title").textContent = title;
        if (value.coordinates) {
          content.append(el("h3", value.coordinates.join(":")));
          for (const selection of value.selections || []) {
            content.append(
              el(
                "p",
                (selection.gene || "") + " | " + (selection.hgvsp || selection.hgvsc || "") + " | " + selection.reason,
              ),
            );
            if (selection.gene_context?.warnings?.length)
              content.append(el("p", selection.gene_context.warnings.join("; "), "warning"));
            if (selection.clinvar?.length)
              table(
                content,
                selection.clinvar,
                [
                  { label: "ClinVar assertion", value: (r) => JSON.stringify(r.CLNSIG) },
                  { label: "Review status", value: (r) => JSON.stringify(r.CLNREVSTAT) },
                  { label: "Disease context", value: (r) => JSON.stringify(r.CLNDN || null) },
                ],
                "ClinVar assertions",
              );
          }
          const evidence = (value.evidence || []).filter((r) => r.caller !== "consensus");
          table(
            content,
            evidence,
            [
              { label: "Caller", value: (r) => r.caller },
              { label: "Filter", value: (r) => r.filter },
              { label: "Depth", value: (r) => r.sample_evidence[r.caller]?.depth },
              { label: "Allele fraction", value: (r) => r.sample_evidence[r.caller]?.af },
              { label: "ALT support", value: (r) => r.sample_evidence[r.caller]?.supporting_reads },
            ],
            "native caller evidence",
          );
          const cosmicRows = [];
          for (const row of evidence)
            for (const source of row.cosmic?.sources || [])
              for (const recurrence of source.recurrence || []) {
                const key = source.source + recurrence.identifier + JSON.stringify(recurrence.values);
                if (!cosmicRows.some((r) => r.key === key))
                  cosmicRows.push({
                    key,
                    source: source.source,
                    id: recurrence.identifier,
                    values: recurrence.values.join(" / "),
                    inconsistent: recurrence.inconsistent,
                    tier: [...new Set(source.observations.map((r) => r.info.TIER).filter(Boolean))].join(", "),
                  });
              }
          if (cosmicRows.length)
            table(
              content,
              cosmicRows,
              [
                { label: "COSMIC ID", value: (r) => r.id },
                { label: "Catalogue", value: (r) => r.source },
                { label: "Recurrence values", value: (r) => r.values + (r.inconsistent ? " (inconsistent)" : "") },
                { label: "Gene Census tier", value: (r) => r.tier || "Not available" },
              ],
              "COSMIC annotations",
            );
        } else if (value.evidence && value.callers) {
          table(
            content,
            value.evidence,
            [
              { label: "Caller", value: (r) => r.caller },
              { label: "VCF sample", value: (r) => r.vcf_sample || r.sample },
              { label: "Native locus 1", value: (r) => r.chrom + ":" + r.pos },
              { label: "Native locus 2", value: (r) => r.partner.chrom + ":" + r.partner.pos },
              { label: "Filter", value: (r) => (r.filter || ["Native semantics"]).join("; ") },
              { label: "Support", value: (r) => r.native_support },
              { label: "Coordinates", value: (r) => r.coordinate_convention },
            ],
            "junction evidence",
          );
        }
        const detail = el("details");
        detail.append(el("summary", "Complete source evidence"), el("pre", JSON.stringify(value, null, 2)));
        content.append(detail);
        document.getElementById("evidence").showModal();
      }
      document.getElementById("close-dialog").onclick = () => document.getElementById("evidence").close();
      document.getElementById("navigation").onkeydown = (e) => {
        if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
        const buttons = [...e.currentTarget.children];
        let i = buttons.indexOf(document.activeElement);
        i =
          e.key === "Home"
            ? 0
            : e.key === "End"
              ? buttons.length - 1
              : (i + (e.key === "ArrowRight" ? 1 : -1) + buttons.length) % buttons.length;
        buttons[i].focus();
        buttons[i].click();
        e.preventDefault();
      };
      function table(parent, rows, columns, title) {
        const box = el("div");
        const controls = el("div", undefined, "controls");
        const search = el("input");
        search.type = "search";
        search.placeholder = "Search " + title;
        search.setAttribute("aria-label", search.placeholder);
        const prev = el("button", "Previous"),
          next = el("button", "Next"),
          count = el("span", undefined, "muted");
        controls.append(search, prev, next, count);
        let cosmicOnly = null;
        if (columns.some((c) => c.label === "COSMIC IDs")) {
          const label = el("label"),
            check = el("input");
          check.type = "checkbox";
          check.onchange = () => {
            page = 0;
            draw();
          };
          label.append(check, document.createTextNode(" COSMIC matches only"));
          controls.append(label);
          cosmicOnly = check;
        }
        box.append(controls);
        const wrap = el("div", undefined, "table-scroll"),
          t = el("table"),
          head = el("thead"),
          tr = el("tr"),
          body = el("tbody");
        let page = 0,
          sort = -1,
          direction = 1;
        columns.forEach((c, i) => {
          const th = el("th");
          if (c.value) {
            const b = el("button", c.label);
            b.onclick = () => {
              direction = sort === i ? -direction : 1;
              sort = i;
              page = 0;
              draw();
            };
            th.append(b);
          } else th.textContent = c.label;
          tr.append(th);
        });
        head.append(tr);
        t.append(head, body);
        wrap.append(t);
        box.append(wrap);
        parent.append(box);
        search.oninput = () => {
          page = 0;
          draw();
        };
        prev.onclick = () => {
          page--;
          draw();
        };
        next.onclick = () => {
          page++;
          draw();
        };
        function draw() {
          let selected = rows.filter(
            (r) =>
              (!cosmicOnly?.checked || (r.evidence || []).some((e) => e.cosmic?.status === "matched")) &&
              JSON.stringify(r).toLowerCase().includes(search.value.toLowerCase()),
          );
          if (sort >= 0)
            selected.sort((a, b) => {
              const av = columns[sort].value(a),
                bv = columns[sort].value(b);
              return (
                direction *
                (typeof av === "number" && typeof bv === "number"
                  ? av - bv
                  : fmt(av).localeCompare(fmt(bv), undefined, { numeric: true }))
              );
            });
          body.replaceChildren();
          for (const r of selected.slice(page * 25, (page + 1) * 25)) {
            const row = el("tr");
            for (const c of columns) {
              const cell = el("td");
              if (c.figure) {
                const figure = data.figures.find((f) => f.event_id === r.id);
                if (figure) {
                  const b = el("button", "Plot");
                  b.onclick = () => zoom(figure);
                  cell.append(b);
                } else cell.textContent = "Not generated";
              } else if (c.plot) {
                const b = el("button", "Plot");
                b.onclick = () => showCoverage(r);
                cell.append(b);
              } else if (c.detail) {
                const b = el("button", "Evidence");
                b.onclick = () => showEvidence(title, r);
                cell.append(b);
              } else cell.textContent = fmt(c.value(r));
              row.append(cell);
            }
            body.append(row);
          }
          count.textContent = `${selected.length ? Math.min(page * 25 + 1, selected.length) : 0}-${Math.min((page + 1) * 25, selected.length)} of ${selected.length} / ${rows.length} total`;
          prev.disabled = page === 0;
          next.disabled = (page + 1) * 25 >= selected.length;
          if (!selected.length) {
            const r = el("tr"),
              c = el("td", "No records match this view.", "empty");
            c.colSpan = columns.length;
            r.append(c);
            body.append(r);
          }
        }
        draw();
      }
      const small = data.small_variants?.records || [],
        events = data.structural_events || [],
        selected = events.filter((e) => e.selected);
      const cards = el("div", undefined, "cards");
      for (const [label, value] of [
        ["Selected small variants", small.length],
        ["Fusion / gene-pair candidates", selected.length],
        ["Corroborated junctions", selected.filter((e) => e.consensus).length],
        ["Reference assembly", data.assembly],
      ]) {
        const c = el("div", undefined, "card");
        c.append(el("div", label, "muted"), el("div", String(value), "value"));
        cards.append(c);
      }
      sections.overview.append(cards);
      if (data.mode === "preview")
        sections.overview.append(
          el(
            "p",
            "Layout preview. External reference joins and production normalisation were not performed.",
            "warning",
          ),
        );
      for (const warning of data.warnings || []) sections.overview.append(el("p", warning, "warning"));
      panel(
        sections.overview,
        "Review context",
        "Selection identifies candidates for review. Caller agreement, predicted consequences and catalogue membership retain their source meaning. Coverage and negative findings require assay-specific interpretation.",
      );
      const status = panel(sections.overview, "Analysis status");
      table(
        status,
        Object.entries(data.statuses || {}).map(([name, state]) => ({ name, state })),
        [
          { label: "Analysis", value: (r) => r.name },
          { label: "Status", value: (r) => r.state },
        ],
        "analysis status",
      );
      const cc = el("div", undefined, "cards");
      for (const c of data.classification || []) {
        const box = el("div", undefined, "card");
        box.append(
          el("h3", c.name),
          el("strong", c.label || c.status),
          el(
            "p",
            "Score: " +
              fmt(c.score) +
              " | Threshold metadata: " +
              Object.entries(c.thresholds || {})
                .map(([k, v]) => k + ": " + fmt(v))
                .join("; "),
            "muted",
          ),
        );
        if (typeof c.score === "number") {
          const bar = el("div", undefined, "scorebar"),
            fill = el("span");
          fill.style.width = Math.max(0, Math.min(100, c.score * 100)) + "%";
          bar.append(fill);
          box.append(bar);
        }
        const b = el("button", "Model evidence");
        b.onclick = () => showEvidence(c.name, c);
        box.append(b);
        cc.append(box);
      }
      sections.classification.append(cc);
      if (!(data.classification || []).length)
        panel(sections.classification, null, "Classification was not run for this sample.");
      const fusionCols = [
        { label: "Gene pair", value: (r) => r.gene_pairs.map((p) => p.join("::")).join("; ") || "Unresolved" },
        {
          label: "Event",
          value: (r) => r.representative?.[0] || r.evidence[0].evidence?.info?.SVTYPE || "Native junction",
        },
        {
          label: "Loci",
          value: (r) =>
            r.evidence[0].chrom +
            ":" +
            r.evidence[0].pos +
            " / " +
            r.evidence[0].partner.chrom +
            ":" +
            r.evidence[0].partner.pos,
        },
        { label: "Callers", value: (r) => r.callers.join(", ") },
        {
          label: "Support by caller",
          value: (r) => r.evidence.map((e) => e.caller + ": " + fmt(e.native_support)).join("; "),
        },
        {
          label: "Consensus",
          value: (r) =>
            r.consensus ? "Breakpoint agreement" : r.ambiguous ? "Ambiguous correspondence" : "Single caller",
        },
        { label: "Plot", figure: true },
        { label: "Details", detail: true },
      ];
      table(
        panel(
          sections.fusions,
          "Prioritised gene-pair events",
          "Curated pairs with applicable native filters and at least three supporting reads. Counts from different callers are not added.",
        ),
        selected,
        fusionCols,
        "fusion candidates",
      );
      table(
        panel(
          sections.fusions,
          "Supporting junction evidence",
          "Includes unselected, low-support, failed-filter and ambiguous junctions.",
        ),
        events.filter((e) => !e.selected),
        fusionCols,
        "supporting junctions",
      );
      function choice(r) {
        return r.selections[0] || {};
      }
      function cosmic(r) {
        const hits = r.evidence.flatMap((e) => e.cosmic?.sources || []).flatMap((s) => s.identifiers || []);
        return (
          [...new Set(hits)].join(", ") ||
          ((r.evidence || []).some((e) => e.cosmic?.status === "no_match") ? "No match" : "Not configured")
        );
      }
      const scols = [
        { label: "Gene", value: (r) => choice(r).gene },
        {
          label: "Change",
          value: (r) => decodeURIComponent(choice(r).hgvsp || choice(r).hgvsc || r.coordinates.slice(1).join(":")),
        },
        { label: "Reason", value: (r) => [...new Set(r.selections.map((s) => s.reason))].join("; ") },
        {
          label: "PASS agreement",
          value: (r) => (r.exact_pass_agreement ? "ClairS-TO + DeepSomatic" : "Independent caller evidence"),
        },
        {
          label: "AF / depth by caller",
          value: (r) =>
            r.evidence
              .filter((e) => e.caller !== "consensus")
              .map((e) => {
                const s = e.sample_evidence[e.caller] || {};
                return `${e.caller}: ${fmt(s.af)} / ${fmt(s.depth)} (${e.filter})`;
              })
              .join("; "),
        },
        { label: "COSMIC IDs", value: cosmic },
        { label: "Details", detail: true },
      ];
      for (const [group, title] of [
        ["findings", "Prioritised findings"],
        ["coding", "Additional coding review"],
        ["supporting", "Supporting small variants"],
        ["consensus_review", "Broad consensus review"],
      ]) {
        const rows = small.filter((r) => r.selections.some((s) => s.review_group === group));
        if (rows.length || group === "findings") table(panel(sections.small, title), rows, scols, title);
      }
      panel(
        sections.small,
        null,
        "Population AF > 0.01 is excluded unless the exact allele is whitelisted. Predicted loss of function and COSMIC recurrence do not establish pathogenicity. COSMIC gene tier is a gene-level Cancer Gene Census property. Full annotation exports retain native filters.",
      );
      table(
        panel(sections.sv, "Copy-number intervals", "Values retain their native caller representation."),
        data.cnv || [],
        [
          { label: "Source", value: (r) => r.source },
          { label: "Chromosome", value: (r) => r.chrom },
          { label: "Native start", value: (r) => r.start },
          { label: "Native end", value: (r) => r.end },
          { label: "Native values", value: (r) => r.native_values.join(" | ") },
          { label: "Details", detail: true },
        ],
        "copy-number intervals",
      );
      table(
        panel(sections.sv, "Other structural evidence"),
        events.filter((e) => !e.selected),
        fusionCols,
        "structural evidence",
      );
      const nsnv = data.nasvar?.snv?.genes;
      if (nsnv)
        table(
          panel(sections.nasvar, "Native genotypes"),
          Object.entries(nsnv).map(([gene, value]) => ({ gene, ...value })),
          [
            { label: "Gene", value: (r) => r.gene },
            { label: "Genotype", value: (r) => r.genotype },
            { label: "Coverage", value: (r) => r.coverage },
            { label: "Amino acid changes", value: (r) => (r.aa_changes || []).join("; ") },
            { label: "Mutations / native AF", value: (r) => JSON.stringify(r.mutations) },
          ],
          "NASVAR genotypes",
        );
      const ncnv = data.nasvar?.cnv?.genes;
      if (ncnv)
        table(
          panel(sections.nasvar, "Native gene copy estimates"),
          Object.entries(ncnv).map(([gene, value]) => ({ gene, ...value })),
          [
            { label: "Gene", value: (r) => r.gene },
            { label: "Focal estimate", value: (r) => r.focal },
            { label: "Local estimate", value: (r) => r.local },
          ],
          "NASVAR gene copy estimates",
        );
      const nk = data.nasvar?.karyotype?.karyotype;
      if (nk)
        table(
          panel(sections.nasvar, "Native chromosome-arm estimates"),
          Object.entries(nk)
            .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))
            .map(([arm, copies]) => ({ arm, copies })),
          [
            { label: "Chromosome / arm", value: (r) => r.arm },
            { label: "Estimated copies", value: (r) => r.copies },
          ],
          "NASVAR chromosome arms",
        );
      const nitd = data.nasvar?.itd?.genes;
      if (nitd)
        table(
          panel(
            sections.nasvar,
            "Native ITD scan",
            "Event counts describe the native scan. They do not establish assay-level absence.",
          ),
          Object.entries(nitd).map(([gene, events]) => ({ gene, events })),
          [
            { label: "Gene", value: (r) => r.gene },
            { label: "Native events", value: (r) => r.events.length },
            { label: "Evidence", detail: true },
          ],
          "NASVAR ITD events",
        );
      for (const key of ["qc", "karyotype", "cnv", "snv", "itd"])
        if (data.nasvar?.[key] !== undefined) {
          const p = panel(sections.nasvar, key.toUpperCase() + " source"),
            d = el("details"),
            s = el("summary", "Native " + key + " results");
          d.append(s, el("pre", JSON.stringify(data.nasvar[key], null, 2)));
          p.append(d);
        }
      const q = panel(
        sections.qc,
        "Region coverage",
        "Mean interval depth. Alignment-filter strata are separate measurements. These summaries do not establish per-base depth thresholds or a copy-number diagnosis.",
      );
      table(
        q,
        data.coverage || [],
        [
          { label: "Gene / interval", value: (r) => r.gene },
          { label: "Chromosome", value: (r) => r.chrom },
          { label: "Start (BED)", value: (r) => r.start },
          { label: "End (BED)", value: (r) => r.end },
          { label: "Primary", value: (r) => r.primary },
          { label: "MAPQ 60", value: (r) => r.mapq60 },
          { label: "Unfiltered", value: (r) => r.nofilter },
          { label: "Plot", plot: true },
        ],
        "coverage regions",
      );
      panel(
        sections.targets,
        null,
        "Target-locus figures show the configured loci and selected evidence. Absence from a prioritised event list is not a negative molecular finding.",
      );
      function showCoverage(row) {
        const dialog = document.getElementById("evidence"),
          content = document.getElementById("dialog-content");
        document.getElementById("dialog-title").textContent =
          (row.gene || "Region") + " | " + row.chrom + ":" + row.start + "-" + row.end;
        const ns = "http://www.w3.org/2000/svg",
          svg = document.createElementNS(ns, "svg");
        svg.setAttribute("viewBox", "0 0 700 210");
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", "Mean region depth by alignment filter");
        const values = ["primary", "mapq60", "nofilter"];
        const maximum = Math.max(1, ...values.map((k) => row[k] || 0));
        values.forEach((key, i) => {
          const y = 25 + i * 55,
            label = document.createElementNS(ns, "text"),
            bar = document.createElementNS(ns, "rect"),
            value = document.createElementNS(ns, "text");
          label.setAttribute("x", 0);
          label.setAttribute("y", y + 20);
          label.textContent = key;
          bar.setAttribute("x", 120);
          bar.setAttribute("y", y);
          bar.setAttribute("width", Math.max(0, ((row[key] || 0) / maximum) * 420));
          bar.setAttribute("height", 28);
          bar.setAttribute("fill", ["#086f83", "#b16832", "#748a96"][i]);
          value.setAttribute("x", 550);
          value.setAttribute("y", y + 20);
          value.textContent = fmt(row[key]) + " mean depth";
          svg.append(label, bar, value);
        });
        content.replaceChildren(
          svg,
          el(
            "p",
            "Mean interval coverage. Filtered measurements are separate strata, not components of a stacked total.",
            "muted",
          ),
        );
        dialog.showModal();
      }
      function loadImage(img) {
        if (!img.src) img.src = data.images[img.dataset.image];
      }
      function zoom(item) {
        const dialog = document.getElementById("evidence"),
          content = document.getElementById("dialog-content");
        document.getElementById("dialog-title").textContent = item.name;
        content.replaceChildren();
        const scale = el("input");
        scale.type = "range";
        scale.min = 50;
        scale.max = 200;
        scale.value = 100;
        scale.setAttribute("aria-label", "Figure zoom");
        const viewport = el("div", undefined, "zoom-scroll"),
          img = el("img");
        img.src = data.images[item.image_key];
        img.alt = item.name;
        img.style.width = "100%";
        scale.oninput = () => (img.style.width = scale.value + "%");
        viewport.append(img);
        content.append(scale, viewport);
        dialog.showModal();
      }
      const galleries = {};
      for (const item of data.figures || []) {
        if (item.generated) continue;
        const id =
          item.category === "fusions"
            ? "fusions"
            : item.category === "target_loci"
              ? "targets"
              : item.category === "coverage"
                ? "qc"
                : item.category === "classification"
                  ? "classification"
                  : "sv";
        if (!galleries[id]) {
          galleries[id] = el("div", undefined, "gallery");
          const archive = el("details"),
            label = el("summary", "Original caller figures");
          archive.append(label, galleries[id]);
          sections[id].append(archive);
        }
        const f = el("figure", undefined, "figure"),
          img = el("img");
        img.dataset.image = item.image_key;
        img.alt = item.name;
        img.loading = "lazy";
        img.onclick = () => zoom(item);
        const b = el("button", "Open full view");
        b.onclick = () => zoom(item);
        f.append(el("figcaption", item.name), img, b);
        galleries[id].append(f);
      }
      const methods = panel(sections.methods, "References and policy");
      const detail = el("details"),
        summary = el("summary", "Resource provenance");
      detail.append(
        summary,
        el(
          "pre",
          JSON.stringify(
            {
              code_sha256: data.code_sha256,
              policy_version: data.policy_version,
              fusion_distance: data.fusion_distance,
              panel: data.panel,
              references: data.references,
              images: data.images_lock || data.images_provenance,
            },
            null,
            2,
          ),
        ),
      );
      methods.append(detail);
      const files = panel(sections.methods, "Complete exports");
      for (const name of [
        "small_variants.tsv.gz",
        "structural_events.tsv.gz",
        "caller_evidence.tsv.gz",
        "manifest.json",
      ]) {
        const p = el("p"),
          a = el("a", name);
        a.href = "review/" + encodeURIComponent(data.sample) + "/" + name;
        p.append(a);
        files.append(p);
      }
      files.append(
        el(
          "p",
          "External export links require the adjacent results directory. This HTML itself works offline.",
          "footnote",
        ),
      );
      window.addEventListener("beforeprint", () => document.querySelectorAll("img[data-image]").forEach(loadImage));
      window.addEventListener("hashchange", () => activate(location.hash.slice(1)));
      activate(location.hash.slice(1) || "overview");
    </script>
    <noscript
      ><p>
        This report requires JavaScript for interactive tables. Complete machine-readable exports accompany the report.
      </p></noscript
    >
  </body>
</html>
