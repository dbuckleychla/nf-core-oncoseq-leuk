<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ sample }} | OncoSeq review</title>
    <style>
      :root {
        --ink: #e6edf3;
        --muted: #a8bbc8;
        --line: #344654;
        --paper: #101820;
        --accent: #68c7c3;
        --warn: #e9b46c;
        --surface: #192631;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      header {
        background: #163748;
        color: white;
        padding: 26px max(24px, calc((100vw - 1360px) / 2));
      }
      header p {
        margin: 4px 0;
        color: #d9e6ed;
      }
      h1 {
        font-size: 28px;
        margin: 0;
      }
      h2 {
        font-size: 23px;
        margin: 0 0 12px;
      }
      h3 {
        font-size: 17px;
        margin: 0 0 8px;
      }
      nav {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding: 12px 20px;
        position: sticky;
        top: 0;
        z-index: 2;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--ink);
        padding: 7px 12px;
        cursor: pointer;
      }
      button:hover,
      button[aria-selected="true"] {
        background: var(--accent);
        border-color: var(--accent);
        color: #101820;
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid #e8ab3b;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
        cursor: default;
      }
      main {
        max-width: 1400px;
        margin: auto;
        padding: 24px;
      }
      .section {
        display: none;
      }
      .section.active {
        display: block;
      }
      .panel,
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 9px;
        padding: 20px;
        margin-bottom: 18px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 14px;
      }
      .card {
        margin: 0;
      }
      .card .value {
        font-size: 28px;
        font-weight: 650;
      }
      .muted {
        color: var(--muted);
      }
      .badge {
        display: inline-block;
        font-size: 13px;
        padding: 2px 7px;
        border-radius: 4px;
        background: #213f43;
        color: #9cddd8;
      }
      .warning {
        background: #3b3022;
        color: #f1cf9a;
        border-left: 4px solid #cb8e39;
        padding: 12px 16px;
        margin: 14px 0;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 12px 0;
      }
      input {
        background: var(--surface);
        color: var(--ink);
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 5px;
        max-width: 100%;
      }
      .table-scroll {
        overflow-x: auto;
        max-width: 100%;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14px;
      }
      th {
        text-align: left;
        background: #21333f;
        white-space: nowrap;
      }
      th,
      td {
        padding: 10px 9px;
        vertical-align: top;
        border-bottom: 1px solid var(--line);
      }
      td {
        overflow-wrap: normal;
        word-break: normal;
      }
      th button {
        border: 0;
        background: transparent;
        padding: 0;
        text-align: left;
      }
      pre {
        font:
          13px/1.5 ui-monospace,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-width: 100%;
      }
      details {
        margin: 10px 0;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr));
        gap: 18px;
      }
      .figure {
        margin: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        min-width: 0;
      }
      .figure img {
        width: 100%;
        height: auto;
        cursor: zoom-in;
      }
      .figure figcaption {
        font-size: 14px;
        overflow-wrap: anywhere;
        margin-bottom: 10px;
      }
      .figure button {
        margin-top: 8px;
      }
      dialog {
        background: var(--surface);
        color: var(--ink);
        width: min(1100px, 96vw);
        max-height: 92vh;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
      }
      dialog::backdrop {
        background: #102936aa;
      }
      .dialog-toolbar {
        display: flex;
        gap: 12px;
        justify-content: space-between;
        position: sticky;
        top: 0;
        background: var(--surface);
        padding-bottom: 10px;
      }
      .zoom-scroll {
        overflow: auto;
        max-height: 75vh;
      }
      .zoom-scroll img {
        display: block;
        max-width: none;
        transform-origin: top left;
      }
      .scorebar {
        height: 8px;
        background: #344654;
        border-radius: 4px;
        margin-top: 8px;
      }
      .scorebar span {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 4px;
      }
      .empty {
        color: var(--muted);
        padding: 12px 0;
      }
      .footnote {
        font-size: 13px;
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
      .workflow-brand img {
        display: block;
        width: min(320px, 100%);
        height: auto;
      }
      .workflow-brand p {
        margin-top: 8px;
      }
      .report-brand {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 10px 0 18px;
      }
      .report-brand svg {
        width: min(180px, 100%);
        height: auto;
      }
      .report-brand span {
        color: #a8bbc8;
        font-size: 15px;
      }
      @media print {
        :root {
          --ink: #172c3d;
          --muted: #526774;
          --line: #d7e0e6;
          --paper: white;
          --surface: white;
          --accent: #086f83;
          color-scheme: light;
        }
        .workflow-brand img {
          background: #163748;
          border-radius: 5px;
        }
        .report-brand svg {
          background: #163748;
          border-radius: 5px;
        }
        .report-brand span {
          color: black;
        }
        header {
          background: var(--surface);
          color: black;
          padding: 10px;
        }
        header p {
          color: black;
        }
        nav,
        .controls,
        button {
          display: none !important;
        }
        main {
          padding: 0;
        }
        .section {
          display: block !important;
          break-before: page;
        }
        .section:first-child {
          break-before: auto;
        }
        .table-scroll {
          overflow: visible;
        }
        tr,
        .card,
        .figure {
          break-inside: avoid;
        }
        .gallery {
          display: block;
        }
        .figure img {
          max-height: 600px;
          object-fit: contain;
        }
        details > * {
          display: block !important;
        }
      }

      .scorebar {
        position: relative;
        height: 12px;
        overflow: visible;
      }
      .threshold-marker {
        position: absolute;
        top: -5px;
        bottom: -5px;
        width: 3px;
        background: #ef4444;
      }
      .card.above {
        border-color: #34d399;
      }
      .card.below {
        border-color: #f59e0b;
      }
      dialog.full-view {
        max-width: 100vw;
        max-height: 100vh;
        width: 100vw;
        height: 100vh;
        margin: 0;
        box-sizing: border-box;
      }
      .zoom-scroll img {
        width: 100%;
        height: 65vh;
        object-fit: contain;
      }
      dialog.full-view .zoom-scroll img {
        height: calc(100vh - 140px);
      }
      .flow {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .flow span {
        padding: 15px;
        border: 1px solid #475569;
        border-radius: 8px;
        flex: 1;
        min-width: 150px;
      }
      .caller-line {
        display: flex;
        flex-direction: column;
        gap: 3px;
        margin-bottom: 12px;
        min-width: 210px;
      }
      #small .gene-column {
        min-width: 112px;
        white-space: nowrap;
        overflow-wrap: normal;
        font-weight: 650;
      }
      #small table {
        font-size: 13px;
      }
      .filter-badge {
        display: inline-block;
        width: fit-content;
        border: 1px solid;
        border-radius: 4px;
        padding: 2px 6px;
        font-weight: 650;
      }
      .evidence-badges {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 5px;
      }
      .evidence-badge {
        display: inline-block;
        border: 1px solid;
        border-radius: 4px;
        padding: 2px 6px;
        font-weight: 600;
      }
      .evidence-blood {
        color: #bae6fd;
        background: #153448;
        border-color: #397795;
      }
      .evidence-somatic {
        color: #99f6e4;
        background: #173c36;
        border-color: #408378;
      }
      .evidence-uncertain {
        color: #fde68a;
        background: #493b15;
        border-color: #9c8531;
      }
      .evidence-neutral {
        color: #d1d5db;
        background: #34383e;
        border-color: #676d76;
      }
      .evidence-pathogenic {
        color: #fecdd3;
        background: #472633;
        border-color: #a16075;
      }
      .filter-pass {
        color: #b7f7ce;
        background: #173e29;
        border-color: #458b61;
      }
      .filter-warning {
        color: #ffec9b;
        background: #493b15;
        border-color: #9c8531;
      }
      .filter-missing {
        color: #d1d5db;
        background: #34383e;
        border-color: #676d76;
      }
      button,
      summary,
      .filter-badge {
        word-break: normal;
        overflow-wrap: normal;
        white-space: nowrap;
      }
      .clinvar-assertion {
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .clinvar-assertion h4 {
        margin: 8px 0 4px;
      }
      .clinvar-assertion ul {
        margin: 4px 0 10px;
        padding-left: 22px;
      }
      .variant-change {
        font-weight: 600;
        overflow-wrap: anywhere;
      }
      .caller-controls {
        display: flex;
        gap: 14px;
        align-items: center;
        flex-wrap: wrap;
        border: 1px solid var(--line);
        border-radius: 6px;
        margin: 10px 0 14px;
        padding: 12px;
      }
      .caller-controls legend {
        font-weight: 650;
      }
      .caller-choice {
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .caller-controls label {
        white-space: nowrap;
      }
      .caller-controls p {
        flex-basis: 100%;
        margin: 0;
        font-size: 13px;
      }
      .reason-list {
        min-width: 260px;
        max-width: 380px;
        margin: 0;
        padding-left: 17px;
        line-height: 1.4;
      }
      .reason-list li {
        margin-bottom: 7px;
      }
    </style>
  </head>

    <script>
      "use strict";
      const data = JSON.parse(document.getElementById("review-data").textContent);
      const el = (tag, text, cls) => {
        const n = document.createElement(tag);
        if (text !== undefined) n.textContent = text;
        if (cls) n.className = cls;
        return n;
      };
      const fmt = (v) =>
        v === null || v === undefined
          ? "Not available"
          : typeof v === "number"
            ? Number(v.toFixed(4)).toLocaleString()
            : String(v);
      const names = [
        ["overview", "Overview"],
        ["classification", "Classification"],
        ["fusions", "Fusions"],
        ["small", "Small variants"],
        ["sv", "Structural variants"],
        ["nasvar", "Copy number / NASVAR"],
        ["targets", "Target genes"],
        ["qc", "Coverage and QC"],
        ["methods", "Methods and files"],
      ];
      const sections = {};
      for (const [id, label] of names) {
        const b = el("button", label);
        b.id = "tab-" + id;
        b.role = "tab";
        b.setAttribute("aria-controls", id);
        b.onclick = () => activate(id);
        document.getElementById("navigation").append(b);
        const s = el("section", undefined, "section");
        s.id = id;
        s.role = "tabpanel";
        s.setAttribute("aria-labelledby", b.id);
        s.append(el("h2", label));
        sections[id] = s;
        document.getElementById("report").append(s);
      }
      function activate(id) {
        if (!sections[id]) id = "overview";
        for (const [k, s] of Object.entries(sections)) {
          s.classList.toggle("active", k === id);
          document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === id));
        }
        history.replaceState(null, "", "#" + id);
        document.querySelectorAll("#" + id + " img[data-image]").forEach(loadImage);
      }
      function panel(section, title, text) {
        const p = el("div", undefined, "panel");
        if (title) p.append(el("h3", title));
        if (text) p.append(el("p", text, "muted"));
        section.append(p);
        return p;
      }
      function showEvidence(title, value) {

          box.append(el("p", fmt(info.publication_count) + " unique reports (PubMed)", "muted"));
        } else box.append(evidenceBadge("Counts unavailable", "uncertain"));
        const statuses = el("div", undefined, "evidence-badges");
        for (const status of info.somatic_categories)
          statuses.append(evidenceBadge(status, status.includes("Unknown") ? "uncertain" : "somatic"));
        box.append(statuses);
        return box;
      }
      function clinvarCell(r) {
        const box = el("div"),
          assertions = clinvar(r);
        if (!assertions.length) box.append(el("span", "No ClinVar assertion"));
        for (const a of assertions) {
          box.append(
            evidenceBadge(annotationText(a.CLNSIG), significanceCategory(a.CLNSIG)),
            el("p", annotationText(a.CLNREVSTAT), "muted"),
          );
          const d = el("details");
          d.append(el("summary", "Assertion details"), clinvarAssertion(a));
          box.append(d);
        }
        return box;
      }
      function simpleTable(parent, rows, columns) {
        const wrap = el("div", undefined, "table-scroll"),
          t = el("table"),
          head = el("thead"),
          tr = el("tr"),
          body = el("tbody");
        for (const c of columns) tr.append(el("th", c.label));
        head.append(tr);
        t.append(head, body);
        for (const row of rows) {
          const line = el("tr");
          for (const c of columns) {
            const cell = el("td");
            if (c.render) cell.append(c.render(row));
            else cell.textContent = fmt(c.value(row));
            line.append(cell);
          }
          body.append(line);
        }
        if (!rows.length) {
          const row = el("tr"),
            cell = el("td", "No caller evidence available.", "muted");
          cell.colSpan = columns.length;
          row.append(cell);
          body.append(row);
        }
        wrap.append(t);
        parent.append(wrap);
      }
      function filterBadge(status) {
        const missing = !status || status === "NO CALL" || status === "NoCall";
        return el(
          "span",
          status === "PASS" ? "Passed" : missing ? "Not reported" : status,
          "filter-badge " + (status === "PASS" ? "filter-pass" : missing ? "filter-missing" : "filter-warning"),
        );
      }
      const scols = [
        { label: "Gene", className: "gene-column", value: (r) => choice(r).gene },
        {
          label: "Change",
          value: (r) => displayChange(choice(r).hgvsp || choice(r).hgvsc || r.coordinates.slice(1).join(":")),
        },
        {
          label: "Inclusion reason",
          value: (r) => reviewReasons(r).join("; "),
          render: (r) => {
            const list = el("ul", undefined, "reason-list");
            for (const reason of reviewReasons(r)) list.append(el("li", reason));
            return list;
          },
        },
        {
          label: "PASS agreement",
          value: (r) => (r.exact_pass_agreement ? "ClairS-TO + DeepSomatic" : "No two-caller agreement"),
        },
        {
          label: "Caller support",
          callerFilters: true,
          render: (r) => {
            const box = el("div");
            for (const [caller, name] of [
              ["clair3", "Clair3"],
              ["clairsto", "ClairS-TO"],
              ["deepsomatic", "DeepSomatic"],
            ]) {
              const evidence = r.evidence.filter((e) => e.caller === caller),
                line = el("div", undefined, "caller-line");
              line.append(el("strong", name));
              if (!evidence.length) line.append(filterBadge(null));
              for (const e of evidence) {
                const v = e.sample_evidence?.[caller] || {},
                  status = Array.isArray(e.filter) ? e.filter.join(", ") : e.filter;
                const percent = typeof v.af === "number" ? (100 * v.af).toFixed(1) + "%" : "—";
                line.append(el("span", percent + " variant · " + readSupport(v) + " reads"), filterBadge(status));
              }
              box.append(line);
            }
            return box;
          },
          value: (r) =>
            r.evidence
              .filter((e) => e.caller !== "consensus")
              .map((e) => {
                const s = e.sample_evidence[e.caller] || {};
                return `${e.caller}: ${fmt(s.af)} · ${readSupport(s)} reads (${e.filter})`;
              })
              .join("; "),
        },
        {
          label: "COSMIC evidence",
          render: cosmicCell,
          value: (r) => {
            const c = r.presentation?.cosmic;
            return c?.matched
              ? [
                  c.blood_match ? "Blood / lymphoid" : "Other tissue",
                  c.sample_count === null ? "Counts unavailable" : c.sample_count + " samples",
                  ...c.somatic_categories,
                  ...c.identifiers,
                ].join("; ")
              : "No COSMIC match";
          },
        },
        {
          label: "ClinVar",
          value: (r) =>
            clinvar(r)
              .map((a) => annotationText(a.CLNSIG))
              .join("; "),
          render: clinvarCell,
        },
        { label: "Details", detail: true },
      ];
      panel(
        sections.small,
        null,
        "The main table shows variants also reported in blood or lymphoid cancers in COSMIC. A separate table shows high-priority variants without COSMIC matches, based on reviewed ClinVar assertions or curated predicted loss of function. Expand the additional view for other COSMIC matches and remaining ClinVar/VEP findings. Each table is sorted by unique COSMIC reports (distinct PubMed publications), highest first. A COSMIC match does not prove that a variant is cancer-causing or acquired in this person. Reported somatic status refers to the COSMIC source samples. Counts show distinct catalogue samples, not necessarily different patients. ClinVar provides pathogenic/uncertain labels when available.",
      );
      for (const [group, title] of [
        ["findings", "COSMIC blood / lymphoid variants"],
        ["noncosmic_findings", "High priority variants without COSMIC matches"],
        ["coding", "Expanded small variant review"],
        ["supporting", "Lower priority and supporting small variants"],
      ]) {
        const rows = small
          .filter((r) => (r.presentation?.group || r.selections[0]?.review_group) === group)
          .sort(compareCosmicReports);
        if (rows.length || ["findings", "noncosmic_findings"].includes(group))
          table(
            ["findings", "noncosmic_findings"].includes(group)
              ? panel(
                  sections.small,
                  title,
                  group === "noncosmic_findings"
                    ? "Reviewed ClinVar pathogenic / likely pathogenic assertions or curated predicted loss of function, without an exact COSMIC match."
                    : undefined,
                )
              : collapsed(sections.small, title, "Other COSMIC matches and additional annotation evidence."),
            rows,
            scols,
            title,
          );
      }
      panel(
        sections.small,
        null,
        "Common variants (population frequency above 1%) are excluded unless specifically whitelisted. Caller support shows variant reads/total reads, alongside the reported variant percentage. A dash means a read count was unavailable; counts are not estimated from the percentage. “Not reported” means no entry for that exact variant.",
      );
      function collapsed(parent, title, description) {
        const d = el("details");
        d.append(el("summary", title));
        parent.append(d);
        return panel(d, null, description);
      }
      const flow = panel(sections.small, "How variants reach this report");
      const steps = el("div", undefined, "flow");
      for (const text of [
        "Clair3 / ClairS-TO / DeepSomatic calls →",
        "Group matching variants; keep failed calls for reference →",
        "Annotate genes, population frequency, ClinVar and COSMIC targeted screens and tissue classification →",
        "Select passing calls and uncommon variants; apply the whitelist →",
        "Prioritize variants for review",
      ])
        steps.append(el("span", text));
      flow.append(
        steps,
        el(
          "p",
          "Two-caller agreement means ClairS-TO and DeepSomatic both passed the same variant. Their percentages and read counts are shown separately. COSMIC matches do not override failed filters or establish a diagnosis.",
          "muted",
        ),
      );
      table(
        collapsed(sections.nasvar, "Copy-number intervals", "Detailed values reported by each caller."),
        data.cnv || [],
        [
          { label: "Source", value: (r) => r.source },
          { label: "Chromosome", value: (r) => r.chrom },
          { label: "Start", value: (r) => r.start },
          { label: "End", value: (r) => r.end },
          { label: "Reported values", value: (r) => r.native_values.join(" | ") },
          { label: "Details", detail: true },
        ],
        "copy-number intervals",
      );
      table(
        panel(sections.sv, "Other structural evidence"),
        events.filter((e) => !e.selected),
        fusionCols,
        "structural evidence",
      );
      const nsnv = data.nasvar?.snv?.genes;
      if (nsnv)
        table(
          panel(sections.nasvar, "NASVAR gene results"),
          Object.entries(nsnv).map(([gene, value]) => ({ gene, ...value })),
          [
            { label: "Gene", value: (r) => r.gene },
            { label: "Genotype", value: (r) => r.genotype },
            { label: "Coverage", value: (r) => r.coverage },
            { label: "Amino acid changes", value: (r) => (r.aa_changes || []).join("; ") },
            { label: "Mutations / variant fraction", value: (r) => JSON.stringify(r.mutations) },
          ],
          "NASVAR genotypes",
        );
      const ncnv = data.nasvar?.cnv?.genes;
      if (ncnv)
        table(
          collapsed(sections.nasvar, "Gene copy estimates"),
          Object.entries(ncnv).map(([gene, value]) => ({ gene, ...value })),
          [
            { label: "Gene", value: (r) => r.gene },
            { label: "Focal estimate", value: (r) => r.focal },
            { label: "Local estimate", value: (r) => r.local },
          ],
          "NASVAR gene copy estimates",
        );
      const nk = data.nasvar?.karyotype?.karyotype;
      if (nk)
        table(
          collapsed(sections.nasvar, "Chromosome-arm estimates"),
          Object.entries(nk)
            .sort((a, b) => a[0].localeCompare(b[0], undefined, { numeric: true }))
            .map(([arm, copies]) => ({ arm, copies })),
          [
            { label: "Chromosome / arm", value: (r) => r.arm },
            { label: "Estimated copies", value: (r) => r.copies },
          ],
          "NASVAR chromosome arms",
        );
      const nitd = data.nasvar?.itd?.genes;
      if (nitd)
        table(
          panel(
            sections.nasvar,
            "ITD results",
            "These are NASVAR results. A negative result does not rule out an alteration.",
          ),
          Object.entries(nitd).map(([gene, events]) => ({ gene, events })),
          [
            { label: "Gene", value: (r) => r.gene },
            { label: "Native events", value: (r) => r.events.length },
            { label: "Evidence", detail: true },
          ],
          "NASVAR ITD events",
        );
      for (const key of ["qc", "karyotype", "cnv", "snv", "itd"])
        if (data.nasvar?.[key] !== undefined) {
          const p = panel(sections.nasvar, key.toUpperCase() + " details"),
            d = el("details"),
            s = el("summary", "Detailed " + key + " results");
          d.append(s, el("pre", JSON.stringify(data.nasvar[key], null, 2)));
          p.append(d);
        }
      if (data.alignment_qc) {
        const alignment = panel(sections.qc, "Read alignment");
        alignment.append(
          el(
            "p",
            "Aligned primary reads divided by all primary reads; secondary and supplementary records are excluded.",
          ),
        );
        alignment.append(el("p", data.alignment_qc.scope, "muted"));
      }
      function qcChart(plot) {
        const box = panel(sections.qc, plot.title),
          ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg"),
          height = 55 + plot.bars.length * 27;
        svg.setAttribute("viewBox", "0 0 1000 " + height);
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", plot.title + " (" + plot.unit + ")");
        svg.style.width = "100%";
        const maximum = Math.max(1, ...plot.bars.map((b) => b.value));
        function text(x, y, value) {
          const t = document.createElementNS(ns, "text");
          t.setAttribute("x", x);
          t.setAttribute("y", y);
          t.setAttribute("fill", "#dbeafe");
          t.setAttribute("font-size", "14");
          t.textContent = value;
          svg.append(t);
        }
        text(210, 22, plot.unit);
        plot.bars.forEach((bar, index) => {
          const y = 38 + index * 27,
            rect = document.createElementNS(ns, "rect");
          text(8, y + 15, bar.label);
          rect.setAttribute("x", 210);
          rect.setAttribute("y", y);
          rect.setAttribute("width", (650 * bar.value) / maximum);
          rect.setAttribute("height", 18);
          rect.setAttribute("fill", "#38bdf8");
          svg.append(rect);
          text(875, y + 15, bar.value.toLocaleString(undefined, { maximumFractionDigits: 1 }));
        });
        box.append(svg);
      }
      for (const plot of data.qc_plots || []) qcChart(plot);
      if (data.extended_qc_html) {
        const expanded = el("div");
        expanded.innerHTML = data.extended_qc_html;
        sections.qc.append(expanded);
      } else {
        panel(
          sections.qc,
          "Read length distributions",
          "Unavailable in these outputs. Enable extended QC with an explicit exact-target BED to add regional read lengths and methylation QC.",
        );
      }
      table(
        panel(
          sections.qc,
          "Coverage and read quality summary",
          "Average target coverage and read quality. These measurements are not an assay pass/fail assessment.",
        ),
        data.qc_summary || [],
        [
          { label: "Metric", value: (r) => r.metric },
          { label: "Value", value: (r) => r.value },
        ],
        "QC metrics",
      );
      table(
        panel(sections.qc, "Lowest-coverage genes", "The 20 genes with the lowest average coverage."),
        data.coverage_genes || [],
        [
          { label: "Gene", value: (r) => r.gene },
          { label: "Primary mean depth", value: (r) => r.depth },
        ],
        "gene coverage",
      );
      const q = collapsed(
        sections.qc,
        "All coverage intervals",
        "Coverage is shown for each target region. The measurements use different alignment filters.",
      );
      table(
        q,
        data.coverage || [],
        [
          { label: "Gene / interval", value: (r) => r.gene },
          { label: "Chromosome", value: (r) => r.chrom },
          { label: "Start (BED)", value: (r) => r.start },
          { label: "End (BED)", value: (r) => r.end },
          { label: "Primary", value: (r) => r.primary },
          { label: "MAPQ 60", value: (r) => r.mapq60 },
          { label: "Unfiltered", value: (r) => r.nofilter },
          { label: "Plot", plot: true },
        ],
        "coverage regions",
      );
      panel(
        sections.targets,
        null,
        "These plots show coverage and structural variants around selected genes. Use them to examine possible copy-number changes or rearrangements; an empty plot does not rule out an alteration.",
      );
      function showCoverage(row) {
        const dialog = document.getElementById("evidence"),
          content = document.getElementById("dialog-content");
        document.getElementById("dialog-title").textContent =
          (row.gene || "Region") + " | " + row.chrom + ":" + row.start + "-" + row.end;
        const ns = "http://www.w3.org/2000/svg",
          svg = document.createElementNS(ns, "svg");
        svg.setAttribute("viewBox", "0 0 700 210");
        svg.setAttribute("role", "img");
        svg.setAttribute("aria-label", "Mean region depth by alignment filter");
        const values = ["primary", "mapq60", "nofilter"];
        const maximum = Math.max(1, ...values.map((k) => row[k] || 0));
        values.forEach((key, i) => {
          const y = 25 + i * 55,
            label = document.createElementNS(ns, "text"),
            bar = document.createElementNS(ns, "rect"),
            value = document.createElementNS(ns, "text");
          label.setAttribute("x", 0);
          label.setAttribute("y", y + 20);
          label.textContent = key;
          bar.setAttribute("x", 120);
          bar.setAttribute("y", y);
          bar.setAttribute("width", Math.max(0, ((row[key] || 0) / maximum) * 420));
          bar.setAttribute("height", 28);
          bar.setAttribute("fill", ["#086f83", "#b16832", "#748a96"][i]);
          value.setAttribute("x", 550);
          value.setAttribute("y", y + 20);
          value.textContent = fmt(row[key]) + " mean depth";
          svg.append(label, bar, value);
        });
        content.replaceChildren(
          svg,
          el("p", "Average coverage in this region, shown separately for each alignment filter.", "muted"),
        );
        dialog.showModal();
      }
      function loadImage(img) {
        if (!img.src) img.src = data.images[img.dataset.image];
      }
      function zoom(item) {
        const dialog = document.getElementById("evidence"),
          content = document.getElementById("dialog-content");
        document.getElementById("dialog-title").textContent = item.name;
        content.replaceChildren();
        dialog.classList.remove("full-view");
        const toggle = el("button", "Full screen view");
        toggle.onclick = () => {
          const active = dialog.classList.toggle("full-view");
          toggle.textContent = active ? "Exit full screen view" : "Full screen view";
          toggle.setAttribute("aria-pressed", String(active));
        };
        dialog.addEventListener("close", () => dialog.classList.remove("full-view"), { once: true });
        const viewport = el("div", undefined, "zoom-scroll"),
          img = el("img");
        img.src = data.images[item.image_key];
        img.alt = item.name;
        viewport.append(img);
        content.append(toggle, viewport);
        dialog.showModal();
      }
      function figurePanel(parent, item) {
        const box = el("figure"),
          img = el("img");
        img.loading = "lazy";
        img.src = data.images[item.image_key];
        img.alt = item.name;
        img.style.width = "100%";
        img.style.maxHeight = "720px";
        img.style.objectFit = "contain";
        const b = el("button", "Open full view");
        b.onclick = () => zoom(item);
        box.append(img, b);
        parent.append(box);
      }
      const cnOverview = el("div");
      sections.nasvar.prepend(cnOverview);
      for (const item of data.figures
        .filter((f) => f.reformatted)
        .sort((a, b) => (a.presentation_order || 0) - (b.presentation_order || 0)))
        figurePanel(cnOverview, item);
      const chromosomePlots = data.figures.filter((f) => f.category === "chromosomes");
      if (chromosomePlots.length) {
        const box = panel(cnOverview, "Chromosome plots");
        for (const chrom of [...Array.from({ length: 22 }, (_, i) => String(i + 1)), "X", "Y"]) {
          const row = el("div", undefined, "chromosome-row");
          row.append(el("h3", "Chromosome " + chrom));
          const matches = chromosomePlots.filter((item) => item.name.match(/chr([0-9]+|X|Y)(?:_|\.)/)?.[1] === chrom);
          if (matches.length) for (const item of matches) figurePanel(row, item);
          else row.append(el("p", "No plot available in the workflow output.", "muted"));
          box.append(row);
        }
      }
      const galleries = {};
      for (const item of data.figures || []) {
        if (item.generated || item.reformatted || item.category === "chromosomes") continue;
        const id =
          item.category === "fusions"
            ? "fusions"
            : item.category === "target_loci"
              ? "targets"
              : item.category === "coverage"
                ? "qc"
                : item.category === "classification"
                  ? "classification"
                  : "sv";
        if (!galleries[id]) {
          galleries[id] = el("div", undefined, "gallery");
          const archive = el("details"),
            label = el("summary", "Original caller figures");
          archive.append(label, galleries[id]);
          sections[id].append(archive);
        }
        const f = el("figure", undefined, "figure"),
          img = el("img");
        img.dataset.image = item.image_key;
        img.alt = item.name;
        img.loading = "lazy";
        img.onclick = () => zoom(item);
        const b = el("button", "Open full view");
        b.onclick = () => zoom(item);
        f.append(el("figcaption", item.name), img, b);
        galleries[id].append(f);
      }
      const methods = panel(sections.methods, "References and policy");
      const detail = el("details"),
        summary = el("summary", "Reference details");
      detail.append(
        summary,
        el(
          "pre",
          JSON.stringify(
            {
              code_sha256: data.code_sha256,
              policy_version: data.policy_version,
              fusion_distance: data.fusion_distance,
              panel: data.panel,
              references: data.references,
              images: data.images_lock || data.images_provenance,
            },
            null,
            2,
          ),
        ),
      );
      methods.append(detail);
      const files = panel(sections.methods, "Downloadable files");
      for (const name of [
        "small_variants.tsv.gz",
        "structural_events.tsv.gz",
        "caller_evidence.tsv.gz",
        "manifest.json",
      ]) {
        const p = el("p"),
          a = el("a", name);
        a.href = "review/" + encodeURIComponent(data.sample) + "/" + name;
        p.append(a);
        files.append(p);
      }
      files.append(
        el(
          "p",
          "External export links require the adjacent results directory. This HTML itself works offline.",
          "footnote",
        ),
      );
      window.addEventListener("beforeprint", () => document.querySelectorAll("img[data-image]").forEach(loadImage));
      window.addEventListener("hashchange", () => activate(location.hash.slice(1)));
      activate(location.hash.slice(1) || "overview");
    </script>
    <noscript
      ><p>
        This report requires JavaScript for interactive tables. Complete machine-readable exports accompany the report.
      </p></noscript
    >
  </body>
