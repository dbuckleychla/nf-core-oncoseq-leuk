repos:
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: "v3.1.0"
    hooks:
      - id: prettier
        additional_dependencies:
          - prettier@3.2.5

  - repo: https://github.com/editorconfig-checker/editorconfig-checker.python
    rev: "3.0.3"
    hooks:
      - id: editorconfig-checker
        alias: ec

  - repo: local
    hooks:
      - id: public-content
        name: Check staged content for clinical IDs and credentials
        entry: python3 scripts/check_public_content.py --staged
        language: system
        pass_filenames: false
        always_run: true
      - id: gitleaks
        name: Gitleaks staged secret scan
        entry: gitleaks git --pre-commit --staged --redact --no-banner --ignore-gitleaks-allow
        language: system
        pass_filenames: false
        always_run: true
