name: Extended QC validation
on:
  push:
    paths:
      - "bin/qc_extended/**"
      - "bin/extended_qc.py"
      - "modules/local/extended_qc/**"
      - "subworkflows/local/extended_qc/**"
      - "tests/qc_extended/**"
      - ".github/workflows/qc-extended.yml"
  pull_request:
    paths:
      - "bin/qc_extended/**"
      - "bin/extended_qc.py"
      - "modules/local/extended_qc/**"
      - "subworkflows/local/extended_qc/**"
      - "tests/qc_extended/**"
      - ".github/workflows/qc-extended.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5
        with:
          python-version: "3.11"
      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.6"
      - name: Install synthetic test dependencies
        run: |
          python -m pip install pysam jsonschema pillow jinja2
          sudo apt-get update
          sudo apt-get install -y samtools
      - name: Metric and report regressions
        run: python -m unittest discover -s tests/qc_extended -p 'test_*.py' -v
      - name: Execute additive Nextflow and publication contract
        run: |
          qc_root=$(mktemp -d)
          python tests/qc_extended/build_fixture.py --outdir "$qc_root/fixture"
          ONCOSEQ_QC_TEST_PATH=$(dirname "$(command -v python)") \
          nextflow run . -main-script tests/subworkflows/local/extended_qc/acceptance.nf \
            -c tests/subworkflows/local/extended_qc/local.config \
            --custom_config_base '' \
            --qc_fixture_dir "$qc_root/fixture" --qc_targets_bed "$qc_root/fixture/targets.bed" \
            --outdir "$qc_root/results" -work-dir "$qc_root/work"
          python tests/qc_extended/check_publication.py "$qc_root/results"
      - name: Free space for locked production images
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
      - name: Real locked-image methylation smoke
        run: python tests/qc_extended/run_container_smoke.py --threads 2
